# Robot and experiment parameters for SCE-672 Phase 3. Values marked MEASURE must be measured on the robot
# before trial 1 (docs/RUN_ON_ROBOT.md). Values marked P2 come from the Phase 2 measurements (2026-10-26).
tag_detector:
  ros__parameters:
    # The tag lies flat on the floor (same T3 print as Phase 2). Distances are to the tag CENTRE.
    target_id: 3               # tag36h11 ID of the printed tag
    tag_size: 0.154            # black edge, measured with a tape 2026-11-15
    quad_decimate: 1.0
    camera_pitch_deg: 6.1      # measured 2026-11-15 from the floor tag at the saved arm pose (height 0.315 m)
    range_scale: 1.0181        # 2026-11-15 run 2 (steered), tape anchors 1.20 + 0.47 m (fit 1.0115 at tag_size 0.155, x 155/154)
    range_offset: -0.1372      # same fit (camera forward -> chassis front)

phase3_ekf:
  ros__parameters:
    # experiment (keep identical for all trials)
    start_distance: 1.20       # m, tape: chassis front -> tag centre. 1.20 (not 1.50): the flat 155 mm tag is only ~10 px tall at 1.5 m and detection was unreliable (2026-11-15)
    stop_distance: 0.50        # m, chassis front -> tag centre. 0.50 (not 0.40): the camera loses the floor tag below ~0.48 m
    front_offset: 0.16         # robot centre -> chassis front (m): URDF wheels at +-0.100, chassis modules at +-0.157; DJI length 320 mm
    control_rate: 20.0
    # robot conventions
    drive_sign: -1.0           # P2: the driver's +x points AWAY from the camera side
    odom_v_sign: -1.0          # CHECK: docs/RUN_ON_ROBOT.md, step 4 (odom speed must be + toward the tag)
    odom_w_sign: 1.0
    odom_source: pose          # 2026-11-15 trial 0: /odom twist lags and over-reads (0.21 at 0.15 m/s, 3-5x at 0.03); pose matched the camera within 1-2 %
    odom_max_speed: 0.40       # m/s, pose mode: a faster reading is a driver glitch and is skipped
    odom_max_turn: 1.50        # rad/s, same
    # camera measurement
    use_tag_range: true        # false = bearing only (comparison run for the report)
    tag_max_age: 0.30
    min_decision_margin: 10.0  # a small floor tag gives weak detections far away; CHECK the margin at the start
    # EKF noise, standard deviations
    sigma_accel: 0.5           # m/s^2   unknown linear acceleration (process noise via G)
    sigma_alpha: 1.0           # rad/s^2 unknown angular acceleration
    q_pos: 1.0e-4              # m^2/s   wheel slip on px, py
    q_theta: 1.0e-4            # rad^2/s
    r_odom_v: 0.02             # m/s     /odom speed noise
    r_odom_w: 0.03             # rad/s   /odom turn-rate noise
    r_tag_d: 0.03              # m       camera range noise
    r_tag_phi: 0.02            # rad     camera bearing noise (about 1.1 deg)
    p0_pos: 0.02               # m       start placement accuracy
    p0_theta: 0.035            # rad     start heading accuracy (about 2 deg)
    tag_gate: 9.21             # chi-square 99 %, 2 values: rejects wild camera readings
    input_tau: 0.3             # s, chassis speed-loop lag used to form u = (a, alpha)
    # controller
    max_speed: 0.15            # m/s
    min_speed: 0.03            # m/s, chassis barely moves below this
    slowdown_gain: 0.6         # 1/s, target speed = gain * distance still to go
    max_accel: 0.25            # m/s^2, gentle ramp, no wheel slip at the start
    steer_gain: 1.0            # rad/s per rad of bearing error
    max_turn_rate: 0.30        # rad/s
    fixes_before_start: 10     # camera fixes needed before moving
    wait_limit: 15.0           # s, give up if the tag never shows up
    settle_time: 2.0           # s standing still before the final reading
    tof_stop: 0.15             # m, safety only
    drive_limit: 30.0          # s, safety only
    # camera arm guard (P2 saved pose; re-save if you move the arm)
    arm_check: true
    arm_x_saved: 0.123
    arm_z_saved: 0.067
    arm_tolerance: 0.006
